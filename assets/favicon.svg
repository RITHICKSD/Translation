<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#0F172A"/>
  <!-- Globe icon (simplified) -->
  <circle cx="16" cy="15" r="8" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Horizontal equator line -->
  <ellipse cx="16" cy="15" rx="4" ry="8" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Latitude lines -->
  <line x1="8" y1="12" x2="24" y2="12" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="8" y1="18" x2="24" y2="18" stroke="#ffffff" stroke-width="1.2"/>
  <!-- Red "Z" letter bottom-right accent -->
  <rect x="19" y="20" width="10" height="10" rx="3" fill="#EF4444"/>
  <text x="24" y="28.5" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">Z</text>
</svg>
